<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XHARMONY // PROTOCOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07070b;
    --panel:#0c0e15;
    --line:#1a1e29;
    --text:#cdeae6;
    --dim:#4d5866;
    --alert:#ff2f5e;
    --ok:#35e0b0;
    --warn:#ffb020;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--void);
    overflow:hidden;
  }
  body{
    font-family:'JetBrains Mono', monospace;
    color:var(--text);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ambient noise / vignette */
  #stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:30;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
  }
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:31;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 2px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }
  .flicker{
    position:fixed; inset:0; pointer-events:none; z-index:32;
    background:rgba(255,255,255,0.02);
    animation:flicker 6s infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:0;}
    92%{opacity:0;}
    93%{opacity:1;}
    94%{opacity:0;}
    97%{opacity:0.4;}
    98%{opacity:0;}
  }

  #console{
    position:relative;
    z-index:10;
    width:min(760px, 88vw);
    height:min(600px, 82vh);
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:6px;
  }

  .topbar{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; letter-spacing:0.14em; color:var(--dim);
    border-bottom:1px solid var(--line);
    padding-bottom:10px; margin-bottom:14px;
    text-transform:uppercase;
  }
  .topbar .dot{color:var(--ok); text-shadow:0 0 8px var(--ok);}

  #log{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:5px;
    font-size:14px;
    line-height:1.55;
    overflow:hidden;
  }
  .row{
    display:flex; gap:10px;
    white-space:pre;
    opacity:0;
    transform:translateY(2px);
  }
  .row.show{ animation:rowIn .25s ease-out forwards; }
  @keyframes rowIn{ to{opacity:1; transform:translateY(0);} }

  .ts{ color:var(--dim); font-size:12px; min-width:64px; }
  .caret{ color:var(--ok); }
  .label{ color:var(--dim); }
  .val{ color:var(--text); font-weight:500; }
  .ok-tag{ color:var(--ok); font-weight:700; margin-left:8px; }
  .warn-tag{ color:var(--warn); font-weight:700; }
  .alert-tag{ color:var(--alert); font-weight:700; }

  #cursor{
    display:inline-block; width:8px; height:15px;
    background:var(--ok); margin-left:2px;
    animation:blink 1s step-end infinite;
    vertical-align:middle;
  }
  @keyframes blink{ 50%{opacity:0;} }

  /* roster grid */
  #roster{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
    margin-top:6px;
  }
  .card{
    border:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), rgba(12,14,21,0.4));
    padding:9px 10px;
    opacity:0;
    transform:scale(0.94);
    filter:blur(2px);
  }
  .card.show{ animation:cardIn .35s ease-out forwards; }
  @keyframes cardIn{
    0%{opacity:0; transform:scale(0.9); filter:blur(4px);}
    60%{opacity:1; transform:scale(1.02); filter:blur(0);}
    100%{opacity:1; transform:scale(1); filter:blur(0);}
  }
  .card .no{ font-size:10px; color:var(--dim); letter-spacing:0.12em; }
  .card .name{ font-size:15px; font-weight:700; color:var(--text); margin:2px 0; }
  .card .kr{ font-size:11px; color:var(--dim); }
  .card .tag{ font-size:9px; letter-spacing:0.1em; color:var(--ok); margin-top:4px; text-transform:uppercase; }

  /* final reveal */
  #finale{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; opacity:0; pointer-events:none;
    text-align:center;
  }
  #finale.show{ opacity:1; animation:glitchSnap .4s ease-out; }
  @keyframes glitchSnap{
    0%{ opacity:0; transform:translate(0,0); }
    20%{ opacity:1; transform:translate(-3px,0); text-shadow:2px 0 var(--alert), -2px 0 var(--ok); }
    40%{ transform:translate(3px,0); }
    60%{ transform:translate(-1px,0); }
    100%{ opacity:1; transform:translate(0,0); text-shadow:none; }
  }
  #finale h1{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:clamp(38px, 7vw, 68px);
    letter-spacing:0.06em;
    color:var(--text);
  }
  #finale .sub{
    font-size:12px; letter-spacing:0.2em; color:var(--ok); text-transform:uppercase;
  }
  #finale .meta{
    font-size:12px; color:var(--dim); letter-spacing:0.08em; margin-top:6px;
  }
  #finale .status{
    margin-top:22px; font-size:11px; letter-spacing:0.18em; color:var(--dim);
    border:1px solid var(--line); padding:8px 16px;
  }
  #finale .status b{ color:var(--ok); }

  #replay{
    position:fixed; bottom:18px; right:18px; z-index:40;
    background:transparent; border:1px solid var(--line); color:var(--dim);
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em;
    padding:7px 12px; cursor:pointer; opacity:0; transition:opacity .4s;
    text-transform:uppercase;
  }
  #replay.show{ opacity:0.6; }
  #replay:hover{ opacity:1; border-color:var(--ok); color:var(--ok); }

  @media (max-width:640px){
    #roster{ grid-template-columns:repeat(2, 1fr); }
    #log{ font-size:12px; }
  }

  /* fix: console fades when wordmark appears */
  #stage.done #console{ opacity:0; transition:opacity .35s; }
  #finale{ z-index:15; }

  /* ===== MEMBER SCAN ===== */
  #members{
    position:fixed; inset:0; z-index:20; background:var(--void);
    display:none; flex-direction:column; padding:28px min(5vw,64px);
  }
  #members.on{ display:flex; animation:fadeIn .4s ease-out; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .m-top{
    display:flex; justify-content:space-between; font-size:11px; letter-spacing:.14em;
    color:var(--dim); text-transform:uppercase; border-bottom:1px solid var(--line); padding-bottom:10px;
  }
  .m-top .dot{ color:var(--ok); text-shadow:0 0 8px var(--ok); }
  #m-count{ color:var(--text); }
  #m-intro{
    flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:14px; letter-spacing:.16em; color:var(--text); line-height:2; white-space:pre-line;
  }
  .m-body{
    flex:1; display:none; align-items:center; justify-content:center; gap:clamp(24px,5vw,64px);
  }
  .m-body.on{ display:flex; }
  .m-body.cut{ animation:cut .26s steps(2); }
  @keyframes cut{
    0%{ transform:translateX(0); opacity:1; }
    30%{ transform:translateX(-14px); opacity:.6; filter:hue-rotate(40deg); }
    60%{ transform:translateX(10px); opacity:.3; }
    100%{ transform:translateX(0); opacity:0; }
  }
  .m-photo{ display:flex; flex-direction:column; gap:10px; }
  .frame{
    position:relative; height:min(64vh,600px); aspect-ratio:3/4; background:#000;
    border:1px solid var(--line); overflow:hidden;
  }
  .frame img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .frame .base{ filter:grayscale(1) contrast(1.25) brightness(.6); }
  .frame .color{ clip-path:inset(0 0 100% 0); }
  .frame .beam{
    position:absolute; left:0; right:0; top:0; height:2px; background:var(--ok);
    box-shadow:0 0 14px 3px rgba(53,224,176,.55); opacity:0;
  }
  .frame .reticle{
    position:absolute; left:27%; top:17%; width:46%; height:42%;
    border:1px dashed rgba(53,224,176,.7); opacity:0;
  }
  .frame .reticle::after{
    content:'FACE LOCK'; position:absolute; left:-1px; top:-17px; font-size:9px;
    letter-spacing:.14em; color:var(--ok);
  }
  .frame .c{ position:absolute; width:16px; height:16px; border:2px solid var(--ok); opacity:.8; }
  .c.tl{ top:8px; left:8px; border-right:0; border-bottom:0; }
  .c.tr{ top:8px; right:8px; border-left:0; border-bottom:0; }
  .c.bl{ bottom:8px; left:8px; border-right:0; border-top:0; }
  .c.br{ bottom:8px; right:8px; border-left:0; border-top:0; }
  .frame.scanning .color{ animation:reveal 3.6s linear forwards; }
  .frame.scanning .beam{ animation:beam 3.6s linear forwards; }
  .frame.scanning .reticle{ animation:ret 3.6s ease-out forwards; }
  @keyframes reveal{ to{ clip-path:inset(0 0 0 0); } }
  @keyframes beam{ 0%{top:0; opacity:1;} 96%{opacity:1;} 100%{top:calc(100% - 2px); opacity:0;} }
  @keyframes ret{ 0%,20%{opacity:0;} 35%{opacity:1;} 50%{opacity:.4;} 65%{opacity:1;} 100%{opacity:.8;} }
  .prog{ height:3px; background:var(--line); }
  .prog i{ display:block; height:100%; width:0; background:var(--ok); }
  .frame.scanning + .prog i{ animation:prog 3.6s linear forwards; }
  @keyframes prog{ to{ width:100%; } }

  .m-data{ width:min(470px,44vw); display:flex; flex-direction:column; gap:7px; font-size:13.5px; line-height:1.5; }
  .m-name{
    font-family:'Orbitron',sans-serif; font-weight:800; font-size:clamp(30px,4.4vw,48px);
    letter-spacing:.06em; animation:glitchSnap .4s ease-out;
  }
  .m-kr{ font-size:13px; color:var(--dim); margin-bottom:8px; letter-spacing:.04em; }
  .drow{ display:grid; grid-template-columns:118px 1fr; gap:10px; opacity:0; animation:rowIn .2s ease-out forwards; }
  .dl{ color:var(--dim); font-size:11.5px; letter-spacing:.1em; padding-top:2px; }
  .dv{ color:var(--text); }
  .drow.ok .dv{ color:var(--ok); font-weight:700; }
  .drow.alert .dv{ color:var(--alert); font-weight:700; text-shadow:1px 0 var(--ok); }
  .drow.alert .dl{ color:var(--alert); }

  #m-end{
    flex:1; display:none; flex-direction:column; align-items:center; justify-content:center; gap:26px;
  }
  #m-end.on{ display:flex; }
  #m-end .strip{ display:flex; gap:10px; }
  #m-end .strip div{
    width:min(11vw,110px); aspect-ratio:3/4; background-size:cover; background-position:center top;
    border:1px solid var(--line); opacity:0; transform:translateY(8px);
  }
  #m-end .strip div.show{ animation:rowIn .35s ease-out forwards; }
  #m-end h2{ font-family:'Orbitron',sans-serif; font-size:clamp(20px,3vw,32px); letter-spacing:.1em; font-weight:600; }
  #m-end .s{ font-size:12px; letter-spacing:.2em; color:var(--ok); }

  @media (max-width:800px){
    .m-body{ flex-direction:column; gap:16px; }
    .frame{ height:36vh; }
    .m-data{ width:100%; font-size:12px; }
  }
</style>
</head>
<body>

<div class="vignette"></div>
<div class="scanlines"></div>
<div class="flicker"></div>

<div id="stage">
  <div id="console">
    <div class="topbar">
      <span><span class="dot">●</span> XYH-OS // SUBJECT SCAN</span>
      <span id="clock">--:--:--</span>
    </div>
    <div id="log"></div>
    <div id="roster"></div>
  </div>
</div>

<div id="finale">
  <div class="sub">PROTOCOL // XYH ENTERTAINMENT</div>
  <h1>XHARMONY</h1>
  <div class="meta">엑스하모니 &nbsp;·&nbsp; 7 UNITS &nbsp;·&nbsp; EST. 2026.01.20</div>
  <div class="status">STATUS: <b>PROTOCOL COMPLETE</b> — NEXT TRANSMISSION 2026.07.31</div>
</div>

<div id="members">
  <div class="m-top"><span><span class="dot">●</span> XYH-OS // UNIT SCAN</span><span id="m-count">00 / 07</span></div>
  <div id="m-intro"></div>
  <div class="m-body" id="m-body">
    <div class="m-photo">
      <div class="frame" id="m-frame">
        <img class="base" id="m-base" alt=""><img class="color" id="m-color" alt="">
        <div class="reticle"></div><div class="beam"></div>
        <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
      </div>
      <div class="prog"><i></i></div>
    </div>
    <div class="m-data" id="m-data"></div>
  </div>
  <div id="m-end">
    <div class="strip" id="m-strip"></div>
    <h2>ALL UNITS VERIFIED</h2>
    <div class="s">7 / 7 · XHARMONY · NO ANOMALIES REMAINING</div>
  </div>
</div>

<button id="replay">↻ replay protocol</button>

<script>
const log = document.getElementById('log');
const roster = document.getElementById('roster');
const finale = document.getElementById('finale');
const replayBtn = document.getElementById('replay');
const clockEl = document.getElementById('clock');

function tick(){
  const d = new Date();
  clockEl.textContent = d.toTimeString().slice(0,8);
}
setInterval(tick, 1000); tick();

const wait = ms => new Promise(r => setTimeout(r, ms));

async function addRow(html, delay=0){
  if(delay) await wait(delay);
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = html;
  log.appendChild(row);
  requestAnimationFrame(()=> row.classList.add('show'));
  return row;
}

function ts(){
  const d = new Date();
  return d.toTimeString().slice(0,8);
}

async function typeLine(prefixHtml, text, targetSpanClass, speed=14){
  const row = await addRow(`<span class="ts">${ts()}</span><span class="caret">&gt;</span> ${prefixHtml}<span class="${targetSpanClass}"></span>`);
  const span = row.querySelector('.'+targetSpanClass);
  for(let i=0;i<text.length;i++){
    span.textContent += text[i];
    await wait(speed);
  }
  return row;
}

const roster_data = [
  {no:"UNIT 01", name:"Jiho", kr:"김진우 · Kim Jinwoo", tag:"Vocal · Charm"},
  {no:"UNIT 02", name:"Hwan", kr:"강현우 · Kang Hyun-woo", tag:"Leader · Main Rap"},
  {no:"UNIT 03", name:"Drax", kr:"권서준 · Kwon Seojun", tag:"Rap · Dance"},
  {no:"UNIT 04", name:"Soka", kr:"김서카 · Kim Seoka", tag:"Vocal · Playful"},
  {no:"UNIT 05", name:"Sekai", kr:"한윤석 · Han Yunseok", tag:"Sub Vocal · Dance"},
  {no:"UNIT 06", name:"B-So", kr:"이수빈 · Lee Soo-bin", tag:"Vocal · Visual"},
  {no:"UNIT 07", name:"Miji", kr:"조임지 · Cho Lim-ji", tag:"Maknae · Vocal · Visual"},
];

async function runGroup(){
  log.innerHTML = ''; roster.innerHTML = '';
  finale.classList.remove('show');
  replayBtn.classList.remove('show');

  await addRow('<span class="ts">'+ts()+'</span><span class="caret">&gt;</span> <span class="val">INITIATING PROTOCOL...</span>', 300);
  await addRow('<span class="ts">'+ts()+'</span><span class="label">SYSTEM</span> <span class="val">XYH-OS v2.6</span>', 400);
  await addRow('<span class="ts">'+ts()+'</span><span class="label">TARGET LOCK</span> <span class="val">XHARMONY</span> <span class="ok-tag">[ACQUIRED]</span>', 500);
  await addRow('<span class="ts">'+ts()+'</span><span class="label">ACCESS</span> <span class="ok-tag">[GRANTED]</span>', 600);
  await wait(500);

  await addRow('<span class="ts">'+ts()+'</span>&nbsp;', 200);
  await addRow('<span class="ts">'+ts()+'</span><span class="label">— CORE DATA —</span>', 100);
  await wait(200);

  const facts = [
    ["PROJECT_NAME", "XHARMONY (엑스하모니)"],
    ["CLASSIFICATION", "DARK K-POP PROTOCOL"],
    ["LABEL", "XYH ENTERTAINMENT"],
    ["LAUNCH_DATE", "2026.01.20"],
    ["UNITS", "7 / 7 ACTIVE"],
    ["FANDOM_ID", 'CROSSIES — "WE CROSS YOUR HARMONY"'],
  ];

  for(const [k,v] of facts){
    const row = await addRow(`<span class="ts">${ts()}</span><span class="label">${k.padEnd(16,'.')}</span> <span class="val">${v}</span> <span class="ok-tag">[OK]</span>`, 260);
  }

  await wait(700);
  await addRow('<span class="ts">'+ts()+'</span>&nbsp;', 100);
  await addRow('<span class="ts">'+ts()+'</span><span class="label">— UNIT ROSTER —</span>', 150);
  await wait(300);

  for(const u of roster_data){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="no">${u.no}</div><div class="name">${u.name}</div><div class="kr">${u.kr}</div><div class="tag">${u.tag}</div>`;
    roster.appendChild(card);
    requestAnimationFrame(()=> card.classList.add('show'));
    await wait(260);
  }

  await wait(900);
  await addRow('<span class="ts">'+ts()+'</span>&nbsp;', 100);
  await addRow('<span class="ts">'+ts()+'</span><span class="label">NEXT_TRANSMISSION</span> <span class="val">"THE LAST REMAINING STAR"</span>', 400);
  await addRow('<span class="ts">'+ts()+'</span><span class="label">마지막 별 · 最后的星</span> <span class="warn-tag">[INCOMING · 2026.07.31]</span>', 500);

  await wait(1400);
  document.getElementById('stage').classList.add('done');
  finale.classList.add('show');
  await wait(2600);

const membersEl = document.getElementById('members');
const mIntro = document.getElementById('m-intro');
const mBody = document.getElementById('m-body');
const mData = document.getElementById('m-data');
const mFrame = document.getElementById('m-frame');
const mCount = document.getElementById('m-count');
const mEnd = document.getElementById('m-end');

async function drow(label, value, cls=''){
  const r = document.createElement('div');
  r.className = 'drow' + (cls ? ' '+cls : '');
  r.innerHTML = '<span class="dl">'+label+'</span><span class="dv"></span>';
  mData.appendChild(r);
  const dv = r.querySelector('.dv');
  for(const ch of value){ dv.textContent += ch; await wait(9); }
  await wait(70);
  return r;
}

async function scanMember(m, i){
  mCount.textContent = '0'+(i+1)+' / 07';
  mData.innerHTML = '';
  document.getElementById('m-base').src = m.img;
  document.getElementById('m-color').src = m.img;
  mFrame.classList.remove('scanning'); void mFrame.offsetWidth; mFrame.classList.add('scanning');
  mBody.classList.add('on');
  const t0 = Date.now();

  mData.insertAdjacentHTML('beforeend', '<div class="m-name">'+m.name+'</div><div class="m-kr">'+m.kr+'</div>');
  await wait(250);
  await drow('UNIT', m.no+' / 07');
  await drow('BORN', m.born);
  await drow('HEIGHT', m.h);
  await drow('HAIR / EYES', m.he);
  await drow('POSITION', m.pos);
  await drow('PERSONALITY', m.pers);
  await drow('VOICE', m.voice);
  await drow('VIBE', m.vibe);
  if(m.extra) await drow(m.extra[0], m.extra[1]);
  const rest = 3800 - (Date.now() - t0);
  if(rest > 0) await wait(rest);
  await drow('IDENTITY', 'VERIFIED [OK]', 'ok');
  if(m.anomaly){ await wait(250); await drow(m.anomaly[0], m.anomaly[1], 'alert'); await wait(900); }
  await wait(1100);
  mBody.classList.add('cut'); await wait(260); mBody.classList.remove('cut');
  mBody.classList.remove('on');
}

async function runMembers(){
  mEnd.classList.remove('on'); mBody.classList.remove('on');
  membersEl.classList.add('on');
  mCount.textContent = '00 / 07';
  mIntro.style.display = 'flex';
  mIntro.textContent = '';
  const intro = 'INITIATING INDIVIDUAL UNIT SCAN\n7 SUBJECTS QUEUED';
  for(const ch of intro){ mIntro.textContent += ch; await wait(24); }
  await wait(1100);
  mIntro.style.display = 'none';
  for(let i=0;i<members.length;i++) await scanMember(members[i], i);
  const strip = document.getElementById('m-strip');
  strip.innerHTML = '';
  members.forEach(m => { const d = document.createElement('div'); d.style.backgroundImage = 'url('+m.img+')'; strip.appendChild(d); });
  mEnd.classList.add('on');
  mCount.textContent = '07 / 07';
  for(const d of strip.children){ d.classList.add('show'); await wait(140); }
}

/* #group = nur Gesamt-Scan · #members = nur Member-Scans · sonst beides */
function getMode(){
  const h = location.hash.replace('#','');
  return (h === 'group' || h === 'members') ? h : 'all';
}

async function runSequence(){
  const mode = getMode();
  replayBtn.classList.remove('show');
  membersEl.classList.remove('on');
  document.getElementById('stage').classList.remove('done');
  finale.classList.remove('show');
  if(mode !== 'members') await runGroup();
  if(mode === 'all'){ await wait(300); finale.classList.remove('show'); }
  if(mode !== 'group') await runMembers();
  replayBtn.classList.add('show');
}

replayBtn.addEventListener('click', runSequence);
window.addEventListener('load', runSequence);
window.addEventListener('hashchange', () => location.reload());
</script>
